name: Paper trading

on:
  schedule:
    # Weekdays at 22:30 UTC: after the US close in both summer (20:00 UTC) and
    # winter (21:00 UTC) time. Holidays are skipped by the script itself.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: paper-trading
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run the session
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::Add the GOOGLE_API_KEY secret under Settings > Secrets and variables > Actions"
            exit 1
          fi
          python -m paper_trading.run daily
      - name: Save the account
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trading/state
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "paper trading: session $(date -u +%F)"
            git push
          fi
